<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <!-- background -->
  <rect x="0" y="0" width="640" height="320" rx="16" fill="#f3efe7"/>

  <!-- faint brain outline behind both halves -->
  <ellipse cx="320" cy="165" rx="288" ry="142" fill="none" stroke="#3c4d68" stroke-width="3" opacity="0.15"/>

  <!-- EEG baselines -->
  <line x1="40" y1="230" x2="300" y2="230" stroke="#ddd5c8" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="230" x2="600" y2="230" stroke="#ddd5c8" stroke-width="2" stroke-linecap="round"/>

  <!-- wake EEG: fast, low amplitude (left half) -->
  <polyline points="40,230 50,216 60,244 70,216 80,244 90,216 100,244 110,216 120,244 130,216 140,244 150,216 160,244 170,216 180,244 190,216 200,244 210,216 220,244 230,216 240,244 250,216 260,244 270,216 280,244 290,216 300,230"
    fill="none" stroke="#b8452f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sleep EEG: slow, high amplitude (right half) -->
  <polyline points="340,230 353,196.1 366,182 379,196.1 392,230 405,263.9 418,278 431,263.9 444,230 457,196.1 470,182 483,196.1 496,230 509,263.9 522,278 535,263.9 548,230 561,196.1 574,182 587,196.1 600,230"
    fill="none" stroke="#b8452f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sun (wakefulness) -->
  <g stroke="#16233a" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="165" cy="90" r="26"/>
    <line x1="165" y1="56" x2="165" y2="42"/>
    <line x1="165" y1="124" x2="165" y2="138"/>
    <line x1="199" y1="90" x2="213" y2="90"/>
    <line x1="131" y1="90" x2="117" y2="90"/>
    <line x1="189" y1="66" x2="198.9" y2="56.1"/>
    <line x1="141" y1="114" x2="131.1" y2="123.9"/>
    <line x1="189" y1="114" x2="198.9" y2="123.9"/>
    <line x1="141" y1="66" x2="131.1" y2="56.1"/>
  </g>

  <!-- crescent moon (sleep / anesthesia) -->
  <circle cx="475" cy="90" r="30" fill="#16233a"/>
  <circle cx="488" cy="80" r="27" fill="#f3efe7"/>

  <!-- curved double-headed transition arrow -->
  <path d="M 270 110 Q 320 55 370 110" fill="none" stroke="#16233a" stroke-width="4.5" stroke-linecap="round"/>
  <polyline points="256.3,113.1 270,110 268.2,123.9" fill="none" stroke="#16233a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="383.7,113.1 370,110 371.8,123.9" fill="none" stroke="#16233a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
