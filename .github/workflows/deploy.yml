name: Deploy Lu Lab website
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate bilingual pages
        run: python scripts/build.py
      - name: Validate links, translations and assets
        run: python scripts/validate.py
      - name: Test interaction logic
        run: node scripts/test-interactions.cjs
      - name: Package static files
        run: python scripts/package.py
      - name: Deploy to existing GitHub Pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
